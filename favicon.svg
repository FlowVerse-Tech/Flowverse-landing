<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradients matching the Flowverse logo -->
    <linearGradient id="fav-f-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27C4FF" />
      <stop offset="50%" stop-color="#2D7BFF" />
      <stop offset="100%" stop-color="#7A4DFF" />
    </linearGradient>
    <radialGradient id="fav-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27C4FF" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#2D7BFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050A1F" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark navy background -->
  <rect width="120" height="120" rx="26" fill="#050A1F" />
  
  <!-- Ambient soft glow -->
  <circle cx="58" cy="60" r="45" fill="url(#fav-glow)" />

  <!-- Circuit Arcs -->
  <!-- Top Arc -->
  <path d="M 32 46 A 34 34 0 0 1 88 40" fill="none" stroke="#2D7BFF" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
  <circle cx="88" cy="40" r="2.8" fill="#27C4FF" filter="url(#glow-blur)" />
  <circle cx="88" cy="40" r="1.5" fill="#FFFFFF" />

  <!-- Bottom Arc -->
  <path d="M 88 74 A 36 36 0 0 1 34 82" fill="none" stroke="#2D7BFF" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
  <circle cx="34" cy="82" r="2.8" fill="#7A4DFF" filter="url(#glow-blur)" />
  <circle cx="34" cy="82" r="1.5" fill="#FFFFFF" />

  <!-- Left node branch -->
  <path d="M 28 58 L 22 58" fill="none" stroke="#2D7BFF" stroke-width="1.5" opacity="0.6" />
  <circle cx="22" cy="58" r="2.5" fill="#27C4FF" />

  <!-- Swooping "F" Mark -->
  <!-- Top wing of F -->
  <path d="M 42 36 C 52 35 72 32 92 34 C 84 41 72 45 52 46 C 45 46 42 42 42 36 Z" fill="#27C4FF" />
  
  <!-- Middle crossbar of F -->
  <path d="M 46 54 C 58 53 74 52 86 55 C 78 61 66 64 50 64 C 47 64 45 60 46 54 Z" fill="#2D7BFF" />
  
  <!-- Flowing spine & tail of F -->
  <path d="M 44 36 C 54 36 50 48 48 60 C 46 72 42 86 28 92 C 34 86 38 78 38 68 C 38 52 38 42 44 36 Z" fill="url(#fav-f-grad)" />

</svg>
